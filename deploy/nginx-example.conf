# Nginx TLS reverse proxy example for lucky-sign
# Place this in /etc/nginx/sites-available/lucky-sign.conf
# and symlink to /etc/nginx/sites-enabled/
#
# Prerequisites:
#   - TLS certificate (Let's Encrypt recommended: certbot --nginx -d api.example.com)
#   - Backend running on 127.0.0.1:8080 (see start-backend.sh)
#
# After setup, only port 443 is exposed publicly.
#
# ============================================================================
# IMPORTANT: WebSocket Connection upgrade map
# ============================================================================
# The map directive below MUST be placed in the main nginx.conf inside http{}.
# It CANNOT be placed in this server-block include file.
#
# For BT Panel (宝塔面板) users:
#   Edit /www/server/nginx/conf/nginx.conf, add inside http { }:
#
# For standard nginx:
#   Edit /etc/nginx/nginx.conf, add inside http { }:
#
# --------------------------------------------------------------------------
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
# --------------------------------------------------------------------------
#
# This map ensures:
#   - WebSocket connections get "Connection: upgrade"
#   - Regular HTTP connections get "Connection: close"
# ============================================================================

upstream lucky_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    # TLS certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (uncomment after confirming HTTPS works)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Rate limiting for auth endpoints (adjust burst/rate as needed)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # API proxy
    location /api/ {
        proxy_pass http://lucky_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Client body size for uploads
        client_max_body_size 6M;
    }

    # Rate-limited auth endpoints
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://lucky_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # WebSocket Proxy Configuration
    # =========================================================================
    # k2 #3+#6: Must not redirect WebSocket connections (breaks Upgrade handshake)
    # NOTE: Requires $connection_upgrade map in main nginx.conf http{} block (see top of file)
    #
    # ANTI-PATTERN (DO NOT USE):
    #   proxy_pass http://lucky_backend/ws/;   # <-- trailing slash causes rewrite!
    #
    # When proxy_pass includes a URI with trailing slash, nginx rewrites /ws → /ws/,
    # which makes Spring Boot throw: NoResourceFoundException: No static resource ws/
    #
    # CORRECT PATTERNS:
    #   proxy_pass http://upstream;            # no URI = no rewrite (preferred)
    #   proxy_pass http://upstream/ws;         # explicit /ws without trailing slash
    # =========================================================================
    location = /ws {
        proxy_pass http://lucky_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_redirect off;
    }

    location /ws/ {
        proxy_pass http://lucky_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static uploads (if not using OSS)
    location /uploads/ {
        alias /www/wwwroot/lucky-api/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # APK downloads
    location /downloads/ {
        alias /www/wwwroot/lucky-api/downloads/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Flutter web app
    location /app/ {
        alias /www/wwwroot/lucky-api/webapp/;
        try_files $uri $uri/ /app/index.html;
        expires 1h;
    }

    location / {
        return 301 /app/;
    }
}
