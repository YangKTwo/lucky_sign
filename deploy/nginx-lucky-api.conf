# nginx reverse proxy for lucky-sign API (production HTTP config)
#
# Backend binds to 127.0.0.1:8080, public access is via nginx :80.
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled/.
#
# For TLS (HTTPS) setup, see nginx-example.conf instead.
#
# k2 #3+#6: WebSocket must handle both /ws and /ws/ without 301 redirects
#
# ============================================================================
# IMPORTANT: WebSocket Connection upgrade map
# ============================================================================
# The map directive below MUST be placed in the main nginx.conf inside http{}.
# It CANNOT be placed in this server-block include file.
#
# For BT Panel (宝塔面板) users:
#   Edit /www/server/nginx/conf/nginx.conf, add inside http { }:
#
# For standard nginx:
#   Edit /etc/nginx/nginx.conf, add inside http { }:
#
# --------------------------------------------------------------------------
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
# --------------------------------------------------------------------------
#
# This map ensures:
#   - WebSocket connections get "Connection: upgrade"
#   - Regular HTTP connections get "Connection: close"
# ============================================================================

server {
    listen 80;
    # Replace with your public IP or domain, e.g. api.example.com
    server_name _;

    client_max_body_size 64m;

    # WebSocket endpoint - exact match for /ws (no trailing slash)
    # Must come before generic / location to prevent 301 redirect
    # NOTE: Requires $connection_upgrade map in main nginx.conf http{} block (see top of file)
    location = /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_redirect off;
    }

    # WebSocket endpoint - prefix match for /ws/
    # NOTE: Requires $connection_upgrade map in main nginx.conf http{} block (see top of file)
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # All other requests
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
