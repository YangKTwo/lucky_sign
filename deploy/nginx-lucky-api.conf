# nginx reverse proxy for lucky-sign API (production HTTP config)
#
# Backend binds to 127.0.0.1:8080, public access is via nginx :80.
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled/.
#
# For TLS (HTTPS) setup, see nginx-example.conf instead.

server {
    listen 80;
    # Replace with your public IP or domain, e.g. api.example.com
    server_name _;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
