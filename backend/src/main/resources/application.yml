server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: lucky-sign
  datasource:
    url: jdbc:mysql://localhost:3306/lucky_sign?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    # 本地请用环境变量或 application-local.yml；勿把真实口令写进仓库
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Production: use 'validate' or 'none'; local dev can use 'update' via JPA_DDL_AUTO env var
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: '0'
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          ssl:
            enable: false

app:
  jwt:
    # REQUIRED: Set JWT_SECRET env var (≥32 chars). No default in production.
    secret: ${JWT_SECRET:}
    # Optional: previous secret for key rotation (tokens signed with old key still valid during transition)
    secret-previous: ${JWT_SECRET_PREVIOUS:}
    expire-days: 7
    # Short-lived access token (minutes); refresh tokens handled separately
    access-token-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
  cors:
    # 逗号分隔；原生 App 不依赖 CORS。Web 调试可设为 http://localhost:* 或具体域名
    allowed-origins: ${CORS_ORIGINS:*}
  upload:
    dir: ./uploads
  download:
    dir: ./downloads
  web:
    # Flutter Web 构建产物；CI 会同步到服务器 webapp/
    dir: ./webapp
  # 阿里云 OSS：在服务器 /www/wwwroot/lucky-api/run.env 里填下面变量，或改此处
  oss:
    enabled: ${OSS_ENABLED:false}
    endpoint: ${OSS_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket: ${OSS_BUCKET:}
    dir-prefix: ${OSS_DIR_PREFIX:lucky-sign/}
    public-base-url: ${OSS_PUBLIC_BASE_URL:}
  # 通义千问：同样在 run.env 填写 AI_API_KEY / AI_MODEL
  ai:
    enabled: ${AI_ENABLED:false}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:qwen-plus}
    base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    mention: ${AI_MENTION:@助手}
    system-prompt: ${AI_SYSTEM_PROMPT:你是「石桥头第一AI」，「今日幸运签」小圈子的社区助手，语气轻松友好，回答简洁，用中文。}
  mail:
    enabled: false
    from: lucky-sign@example.com
  timezone: Asia/Shanghai

logging:
  level:
    com.luckysign: INFO
