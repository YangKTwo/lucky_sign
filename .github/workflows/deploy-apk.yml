name: Publish APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/deploy-apk.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          RAW="$(grep -E '^version:' mobile/pubspec.yaml | head -1 | awk '{print $2}' | tr -d '"' | tr -d "'")"
          # pubspec: 0.1.0+1 → name=0.1.0, code fallback=1
          NAME="${RAW%%+*}"
          CODE="${RAW##*+}"
          if [[ "$CODE" == "$RAW" || -z "$CODE" ]]; then
            CODE="1"
          fi
          BUILD="${{ github.run_number }}"
          APK_FILE="lucky-sign-${NAME}-${BUILD}.apk"
          {
            echo "name=${NAME}"
            echo "code=${CODE}"
            echo "build=${BUILD}"
            echo "apk_file=${APK_FILE}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved version name=${NAME} build=${BUILD} file=${APK_FILE}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install CMake for JNI build
        run: |
          # flutter_secure_storage 等插件需要 CMake 编译 JNI/native 代码
          # 不指定 NDK——gradle 会根据 build.gradle.kts 中 ndkVersion 自动下载
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1"
          echo "CMake installed for flutter_secure_storage JNI build"

      - name: Build release APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name="${{ steps.ver.outputs.name }}" \
            --build-number="${{ steps.ver.outputs.build }}"

      - name: Prepare download files
        id: prep
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          APK_FILE: ${{ steps.ver.outputs.apk_file }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_HOST}" ]]; then
            echo "DEPLOY_HOST secret is empty" >&2
            exit 1
          fi
          mkdir -p dist/downloads
          SRC="mobile/build/app/outputs/flutter-apk/app-release.apk"
          cp "$SRC" "dist/downloads/${APK_FILE}"
          # 兼容旧习惯：额外提供 latest 别名（内容与本版本相同）
          cp "$SRC" "dist/downloads/lucky-sign-latest.apk"
          SIZE=$(stat -c%s "dist/downloads/${APK_FILE}")
          UPDATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BASE="http://${DEPLOY_HOST}:8080/downloads"
          URL="${BASE}/${APK_FILE}"
          LATEST_ALIAS="${BASE}/lucky-sign-latest.apk"
          PAGE="${BASE}/index.html"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "page=${PAGE}" >> "$GITHUB_OUTPUT"
          echo "alias=${LATEST_ALIAS}" >> "$GITHUB_OUTPUT"

          # 纯文本，方便直接复制
          printf '%s\n' "$URL" > dist/downloads/latest.txt

          cat > dist/downloads/latest.json <<EOF
          {
            "file": "${APK_FILE}",
            "version": "${VERSION_NAME}",
            "build": ${BUILD_NUMBER},
            "bytes": ${SIZE},
            "updatedAt": "${UPDATED}",
            "url": "${URL}",
            "latestAliasUrl": "${LATEST_ALIAS}",
            "page": "${PAGE}"
          }
          EOF

          cat > dist/downloads/index.html <<EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>今日幸运签 下载</title>
          </head>
          <body style="font-family:sans-serif;max-width:480px;margin:48px auto;padding:0 16px;line-height:1.6">
            <h1>今日幸运签</h1>
            <p>当前版本 <strong>${VERSION_NAME} (build ${BUILD_NUMBER})</strong></p>
            <p><a href="./${APK_FILE}">下载本版本 APK（安卓）</a></p>
            <p><a href="/app/">网页版（iPhone / 浏览器）</a></p>
            <p style="font-size:13px;word-break:break-all;background:#f6f6f6;padding:10px 12px;border-radius:8px">${URL}</p>
            <p style="color:#666;font-size:13px">更新时间（UTC）：${UPDATED}</p>
            <p style="color:#888;font-size:12px">历史包保留在同目录；也可看 <a href="./latest.txt">latest.txt</a> / <a href="./latest.json">latest.json</a></p>
          </body>
          </html>
          EOF

      - name: Write link to job summary
        env:
          URL: ${{ steps.prep.outputs.url }}
          PAGE: ${{ steps.prep.outputs.page }}
          ALIAS: ${{ steps.prep.outputs.alias }}
          APK_FILE: ${{ steps.ver.outputs.apk_file }}
        run: |
          {
            echo "## APK 已发布"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 文件 | \`${APK_FILE}\` |"
            echo "| 本版本链接 | ${URL} |"
            echo "| 下载页 | ${PAGE} |"
            echo "| latest 别名 | ${ALIAS} |"
            echo ""
            echo "复制下面这一行即可："
            echo ""
            echo '```'
            echo "${URL}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure remote directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: mkdir -p /www/wwwroot/lucky-api/downloads

      - name: Upload APK
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "dist/downloads/*"
          target: "/www/wwwroot/lucky-api/downloads/"
          strip_components: 2
          overwrite: true
