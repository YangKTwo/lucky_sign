name: Publish Web

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter web
        working-directory: mobile
        run: |
          flutter pub get
          # 挂在后端同源 /app/；API/WS 由页面自动推导
          # --no-web-resources-cdn: 使用本地 CanvasKit 而非 gstatic CDN
          # 原因：中国移动网络经常无法访问 gstatic.com，导致白屏
          flutter build web --release --base-href=/app/ --no-web-resources-cdn

      - name: Verify local CanvasKit
        run: |
          # 确认构建产物使用本地 CanvasKit 而非 gstatic CDN
          if ! grep -q '"useLocalCanvasKit":true' mobile/build/web/flutter_bootstrap.js; then
            echo "::error::flutter_bootstrap.js 缺少 useLocalCanvasKit:true，中国用户可能白屏"
            exit 1
          fi
          echo "✓ 已确认使用本地 CanvasKit"

      - name: Resolve public URL
        id: url
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_HOST}" ]]; then
            echo "::error::DEPLOY_HOST secret is empty"
            exit 1
          fi
          # Use https:// for all published URLs (requires TLS on server)
          WEB_URL="https://${DEPLOY_HOST}/app/"
          echo "web_url=${WEB_URL}" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          printf '%s\n' "$WEB_URL" > dist/web-latest.txt
          cat > dist/web-latest.json <<EOF
          {
            "url": "${WEB_URL}",
            "updatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run": ${{ github.run_number }}
          }
          EOF

      - name: Pack web artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C mobile/build/web -czf dist/webapp.tar.gz .
          test -f dist/webapp.tar.gz

      - name: Write link to job summary
        env:
          WEB_URL: ${{ steps.url.outputs.web_url }}
        run: |
          {
            echo "## Web 已发布"
            echo ""
            echo "iPhone / 浏览器打开："
            echo ""
            echo '```'
            echo "${WEB_URL}"
            echo '```'
            echo ""
            echo "Safari 可「分享 → 添加到主屏幕」。与安卓 APK 共用同一账号与数据。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure remote directories
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: mkdir -p /www/wwwroot/lucky-api /www/wwwroot/lucky-api/downloads

      - name: Upload web tarball and link files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "dist/webapp.tar.gz,dist/web-latest.txt,dist/web-latest.json"
          target: "/www/wwwroot/lucky-api/"
          strip_components: 1
          overwrite: true

      - name: Extract webapp
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /www/wwwroot/lucky-api
            rm -rf webapp
            mkdir webapp
            tar -xzf webapp.tar.gz -C webapp
            rm -f webapp.tar.gz
            mv -f web-latest.txt web-latest.json downloads/ 2>/dev/null || true
            test -f webapp/index.html
            echo "webapp files:" $(ls webapp | wc -l)
