name: Setup HTTPS (Let's Encrypt + Nginx)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Custom domain (leave empty for auto sslip.io based on server IP)"
        required: false
        default: ""
      use_staging:
        description: "Use Let's Encrypt staging server (for testing, avoids rate limits)"
        required: false
        type: boolean
        default: false

jobs:
  setup-https:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve domain
        id: domain
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          INPUT_DOMAIN: ${{ inputs.domain }}
        run: |
          set -euo pipefail
          
          if [[ -n "${INPUT_DOMAIN}" ]]; then
            DOMAIN="${INPUT_DOMAIN}"
            echo "Using custom domain: ${DOMAIN}"
          else
            # Resolve IP from DEPLOY_HOST
            HOST="${DEPLOY_HOST}"
            if [[ -z "${HOST}" ]]; then
              echo "::error::DEPLOY_HOST secret is not set"
              exit 1
            fi
            
            # Check if DEPLOY_HOST is already an IPv4 address
            if [[ "${HOST}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              IP="${HOST}"
            else
              # Resolve hostname to IP
              IP=$(dig +short "${HOST}" A | head -1 || true)
              if [[ -z "${IP}" ]]; then
                IP=$(getent ahosts "${HOST}" | awk 'NR==1{print $1}' || true)
              fi
              if [[ -z "${IP}" ]]; then
                echo "::error::Could not resolve IP for ${HOST}"
                exit 1
              fi
            fi
            
            # Convert IP to sslip.io format: 1.2.3.4 -> 1-2-3-4.sslip.io
            DOMAIN="${IP//./-}.sslip.io"
            echo "Auto-resolved sslip.io domain: ${DOMAIN} (from IP: ${IP})"
          fi
          
          echo "domain=${DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "api_base=https://${DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "ws_base=wss://${DOMAIN}/ws" >> "$GITHUB_OUTPUT"

      - name: Setup HTTPS on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOMAIN: ${{ steps.domain.outputs.domain }}
          USE_STAGING: ${{ inputs.use_staging }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DOMAIN,USE_STAGING
          script_stop: true
          script: |
            set -euo pipefail
            
            echo "=== Setting up HTTPS for ${DOMAIN} ==="
            
            # Detect package manager and OS
            if command -v apt-get &>/dev/null; then
              PKG_MGR="apt"
              echo "Detected: Debian/Ubuntu (apt)"
            elif command -v dnf &>/dev/null; then
              PKG_MGR="dnf"
              echo "Detected: Fedora/RHEL 8+ (dnf)"
            elif command -v yum &>/dev/null; then
              PKG_MGR="yum"
              echo "Detected: RHEL/CentOS (yum)"
            else
              echo "ERROR: Could not detect package manager"
              exit 1
            fi
            
            # Detect Alibaba Linux to avoid epel-release conflicts
            IS_ALINUX=false
            if grep -qiE '(alibaba|alinux|aliyun)' /etc/os-release 2>/dev/null; then
              IS_ALINUX=true
              echo "Detected: Alibaba Cloud Linux"
            fi
            
            # Disable exit-on-error for ALL install and certbot operations
            # We will only exit explicitly on real failures
            set +e
            
            # Install nginx if not present
            if ! command -v nginx &>/dev/null; then
              echo "Installing nginx..."
              if [[ "$PKG_MGR" == "apt" ]]; then
                sudo apt-get update -qq
                sudo apt-get install -y -qq nginx
                NGINX_RC=$?
              else
                # yum/dnf: try direct install first
                echo "Attempting: $PKG_MGR install nginx"
                sudo $PKG_MGR install -y nginx 2>&1 | tail -20
                NGINX_RC=$?
                if [[ $NGINX_RC -ne 0 ]]; then
                  echo "Direct nginx install failed (exit $NGINX_RC)"
                  # Only install epel-release if not Alibaba Linux and epel not present
                  if [[ "$IS_ALINUX" == "false" ]] && ! rpm -q epel-release &>/dev/null && ! rpm -q epel-aliyuncs-release &>/dev/null; then
                    echo "Installing EPEL repository..."
                    sudo $PKG_MGR install -y epel-release 2>&1 | tail -10 || true
                  fi
                  sudo $PKG_MGR install -y nginx 2>&1 | tail -20
                  NGINX_RC=$?
                fi
              fi
              if [[ $NGINX_RC -ne 0 ]] && ! command -v nginx &>/dev/null; then
                echo "ERROR: Failed to install nginx"
                exit 1
              fi
            fi
            echo "nginx version: $(nginx -v 2>&1 || true)"
            
            # Install certbot - with fallbacks for different distros
            # NOTE: set +e is already active from nginx install section
            
            CERTBOT_METHOD=""
            HAS_NGINX_PLUGIN=false
            
            if command -v certbot &>/dev/null; then
              # Check if existing certbot is from our pip venv
              if [[ -x /opt/certbot-venv/bin/certbot ]]; then
                CERTBOT_METHOD="pip-existing"
                echo "certbot already installed (from pip venv)"
              else
                CERTBOT_METHOD="existing"
                echo "certbot already installed (system package)"
              fi
            fi
            
            # On Alibaba Linux, prefer pip install (repos often lack certbot)
            if [[ -z "$CERTBOT_METHOD" ]] && [[ "$IS_ALINUX" == "true" ]]; then
              echo "Alibaba Linux detected - trying pip/venv install first..."
              echo "Installing Python dependencies..."
              sudo $PKG_MGR install -y python3 python3-pip 2>&1 | tail -10
              # Try python3-venv, fall back to python3-virtualenv
              sudo $PKG_MGR install -y python3-venv 2>&1 | tail -5 || \
                sudo $PKG_MGR install -y python3-virtualenv 2>&1 | tail -5 || true
              
              if command -v python3 &>/dev/null; then
                echo "Creating certbot virtualenv..."
                sudo rm -rf /opt/certbot-venv 2>/dev/null || true
                sudo python3 -m venv /opt/certbot-venv 2>&1 || sudo python3 -m virtualenv /opt/certbot-venv 2>&1 || true
                if [[ -f /opt/certbot-venv/bin/pip ]]; then
                  echo "Installing certbot via pip..."
                  sudo /opt/certbot-venv/bin/pip install --upgrade pip 2>&1 | tail -5
                  sudo /opt/certbot-venv/bin/pip install certbot 2>&1 | tail -10
                  PIP_RC=$?
                  if [[ $PIP_RC -eq 0 ]] && [[ -f /opt/certbot-venv/bin/certbot ]]; then
                    sudo ln -sf /opt/certbot-venv/bin/certbot /usr/bin/certbot
                    CERTBOT_METHOD="pip-alinux"
                    echo "certbot installed via pip (Alibaba Linux)"
                  else
                    echo "pip install certbot failed (exit $PIP_RC)"
                  fi
                else
                  echo "Failed to create virtualenv"
                fi
              fi
            fi
            
            # Try package manager install (apt or yum/dnf)
            if [[ -z "$CERTBOT_METHOD" ]]; then
              echo "Installing certbot via package manager..."
              if [[ "$PKG_MGR" == "apt" ]]; then
                sudo apt-get update -qq
                sudo apt-get install -y -qq certbot python3-certbot-nginx 2>&1
                APT_RC=$?
                if [[ $APT_RC -eq 0 ]]; then
                  CERTBOT_METHOD="apt"
                else
                  echo "apt install failed (exit $APT_RC)"
                fi
              else
                # yum/dnf: try direct install first without adding epel-release
                echo "Attempting: $PKG_MGR install certbot python3-certbot-nginx"
                sudo $PKG_MGR install -y certbot python3-certbot-nginx 2>&1 | tail -20
                PKG_RC=$?
                if [[ $PKG_RC -eq 0 ]]; then
                  CERTBOT_METHOD="$PKG_MGR"
                else
                  echo "$PKG_MGR install with nginx plugin failed (exit $PKG_RC)"
                  echo "Attempting: $PKG_MGR install certbot (without nginx plugin)"
                  sudo $PKG_MGR install -y certbot 2>&1 | tail -20
                  PKG_RC=$?
                  if [[ $PKG_RC -eq 0 ]]; then
                    CERTBOT_METHOD="$PKG_MGR-no-plugin"
                  else
                    echo "$PKG_MGR install certbot failed (exit $PKG_RC)"
                    # Only try epel-release if not Alibaba Linux and epel not already present
                    if [[ "$IS_ALINUX" == "false" ]] && ! rpm -q epel-release &>/dev/null && ! rpm -q epel-aliyuncs-release &>/dev/null; then
                      echo "Trying with EPEL repository..."
                      sudo $PKG_MGR install -y epel-release 2>&1 | tail -10 || true
                      sudo $PKG_MGR install -y certbot python3-certbot-nginx 2>&1 | tail -20
                      if [[ $? -eq 0 ]]; then
                        CERTBOT_METHOD="$PKG_MGR-epel"
                      else
                        sudo $PKG_MGR install -y certbot 2>&1 | tail -20
                        if [[ $? -eq 0 ]]; then
                          CERTBOT_METHOD="$PKG_MGR-epel-no-plugin"
                        fi
                      fi
                    fi
                  fi
                fi
              fi
            fi
            
            # Fallback: snap install
            if [[ -z "$CERTBOT_METHOD" ]] && command -v snap &>/dev/null; then
              echo "Trying snap install..."
              sudo snap install --classic certbot 2>&1 | tail -10
              SNAP_RC=$?
              if [[ $SNAP_RC -eq 0 ]]; then
                sudo ln -sf /snap/bin/certbot /usr/bin/certbot 2>/dev/null || true
                CERTBOT_METHOD="snap"
              else
                echo "snap install failed (exit $SNAP_RC)"
              fi
            fi
            
            # Fallback: pip/venv install (for non-alinux systems that failed above)
            if [[ -z "$CERTBOT_METHOD" ]]; then
              echo "Trying pip/venv install as final fallback..."
              if [[ "$PKG_MGR" == "apt" ]]; then
                sudo apt-get install -y -qq python3 python3-pip python3-venv 2>&1 | tail -10 || true
              else
                sudo $PKG_MGR install -y python3 python3-pip 2>&1 | tail -10 || true
                sudo $PKG_MGR install -y python3-venv 2>&1 | tail -5 || \
                  sudo $PKG_MGR install -y python3-virtualenv 2>&1 | tail -5 || true
              fi
              if command -v python3 &>/dev/null; then
                sudo rm -rf /opt/certbot-venv 2>/dev/null || true
                sudo python3 -m venv /opt/certbot-venv 2>&1 || sudo python3 -m virtualenv /opt/certbot-venv 2>&1 || true
                if [[ -f /opt/certbot-venv/bin/pip ]]; then
                  sudo /opt/certbot-venv/bin/pip install --upgrade pip 2>&1 | tail -5
                  sudo /opt/certbot-venv/bin/pip install certbot 2>&1 | tail -10
                  PIP_RC=$?
                  if [[ $PIP_RC -eq 0 ]] && [[ -f /opt/certbot-venv/bin/certbot ]]; then
                    sudo ln -sf /opt/certbot-venv/bin/certbot /usr/bin/certbot
                    CERTBOT_METHOD="pip"
                  else
                    echo "pip install certbot failed (exit $PIP_RC)"
                  fi
                fi
              fi
            fi
            
            # NOTE: set +e remains active through all certbot operations
            # certbot can return non-zero even on success (CryptographyDeprecationWarning)
            
            if [[ -z "$CERTBOT_METHOD" ]]; then
              echo "ERROR: Failed to install certbot via any method"
              exit 1
            fi
            
            echo "certbot installed via: ${CERTBOT_METHOD}"
            # Print version safely - certbot may return non-zero with warnings
            echo -n "certbot version: "
            certbot --version 2>&1 || true
            echo ""
            
            # For pip-installed or venv certbot, always use webroot (no nginx plugin)
            # This includes: pip-alinux, pip-existing, pip, etc.
            if [[ "$CERTBOT_METHOD" == pip* ]] || [[ -x /opt/certbot-venv/bin/certbot ]]; then
              echo "pip/venv certbot detected: using webroot method (nginx plugin not available)"
              HAS_NGINX_PLUGIN=false
            else
              # Check for nginx plugin - do this safely without pipefail issues
              echo "Checking for nginx plugin..."
              PLUGIN_OUTPUT=$(certbot plugins 2>&1 || true)
              if echo "$PLUGIN_OUTPUT" | grep -q "nginx"; then
                HAS_NGINX_PLUGIN=true
                echo "nginx plugin: available"
              else
                HAS_NGINX_PLUGIN=false
                echo "nginx plugin: NOT available (will use webroot)"
              fi
            fi
            
            # Ensure required directories
            echo "Creating directories..."
            sudo mkdir -p /www/wwwroot/lucky-api/{uploads,downloads,webapp}
            sudo mkdir -p /var/www/certbot
            sudo chown -R "$(whoami)":"$(whoami)" /www/wwwroot/lucky-api 2>/dev/null || true
            
            # Detect nginx configuration paths
            # Check existence FIRST before any parsing to avoid pipefail issues
            echo "Detecting nginx configuration..."
            NGINX_MAIN_CONF=""
            NGINX_VHOST_DIR=""
            
            # Check BT Panel paths first (most specific)
            echo "Checking for BT Panel nginx..."
            if [[ -f "/www/server/nginx/conf/nginx.conf" ]]; then
              NGINX_MAIN_CONF="/www/server/nginx/conf/nginx.conf"
              echo "Found BT Panel nginx config: $NGINX_MAIN_CONF"
            elif [[ -f "/etc/nginx/nginx.conf" ]]; then
              NGINX_MAIN_CONF="/etc/nginx/nginx.conf"
              echo "Found standard nginx config: $NGINX_MAIN_CONF"
            elif [[ -f "/usr/local/nginx/conf/nginx.conf" ]]; then
              NGINX_MAIN_CONF="/usr/local/nginx/conf/nginx.conf"
              echo "Found custom nginx config: $NGINX_MAIN_CONF"
            else
              # Try to get from nginx -t as last resort (safe parsing)
              echo "Trying nginx -t to detect config path..."
              NGINX_TEST_OUT=""
              NGINX_TEST_OUT=$(sudo nginx -t 2>&1) || true
              echo "nginx -t: $NGINX_TEST_OUT"
              # Safe extraction without pipefail issues
              if [[ "$NGINX_TEST_OUT" == *"/www/server/nginx/conf/nginx.conf"* ]]; then
                NGINX_MAIN_CONF="/www/server/nginx/conf/nginx.conf"
              elif [[ "$NGINX_TEST_OUT" == *"/etc/nginx/nginx.conf"* ]]; then
                NGINX_MAIN_CONF="/etc/nginx/nginx.conf"
              elif [[ "$NGINX_TEST_OUT" == *"/usr/local/nginx/conf/nginx.conf"* ]]; then
                NGINX_MAIN_CONF="/usr/local/nginx/conf/nginx.conf"
              fi
              if [[ -n "$NGINX_MAIN_CONF" ]]; then
                echo "Detected nginx config from nginx -t: $NGINX_MAIN_CONF"
              else
                echo "WARNING: Could not detect nginx.conf location"
              fi
            fi
            
            # Detect vhost directory - check BT Panel first
            echo "Checking for vhost directory..."
            if [[ -d "/www/server/panel/vhost/nginx" ]]; then
              NGINX_VHOST_DIR="/www/server/panel/vhost/nginx"
              echo "Found BT Panel vhost directory: $NGINX_VHOST_DIR"
            elif [[ -d "/www/server/nginx/conf/vhost" ]]; then
              NGINX_VHOST_DIR="/www/server/nginx/conf/vhost"
              echo "Found BT nginx vhost directory: $NGINX_VHOST_DIR"
            elif [[ -d "/etc/nginx/sites-available" ]]; then
              NGINX_VHOST_DIR="/etc/nginx/sites-available"
              echo "Found Debian-style sites-available: $NGINX_VHOST_DIR"
            elif [[ -d "/etc/nginx/conf.d" ]]; then
              NGINX_VHOST_DIR="/etc/nginx/conf.d"
              echo "Found conf.d directory: $NGINX_VHOST_DIR"
            fi
            
            # If no vhost dir found, create one
            if [[ -z "$NGINX_VHOST_DIR" ]]; then
              if [[ "$NGINX_MAIN_CONF" == "/www/server/nginx/conf/nginx.conf" ]]; then
                NGINX_VHOST_DIR="/www/server/nginx/conf/vhost"
              elif [[ -n "$NGINX_MAIN_CONF" ]]; then
                NGINX_VHOST_DIR="$(dirname "$NGINX_MAIN_CONF")/conf.d"
              else
                NGINX_VHOST_DIR="/etc/nginx/conf.d"
              fi
              echo "Creating vhost directory: $NGINX_VHOST_DIR"
              sudo mkdir -p "$NGINX_VHOST_DIR"
              
              # Try to add include to main conf (only if file exists)
              if [[ -f "$NGINX_MAIN_CONF" ]]; then
                # Check if include already exists (safe grep)
                INCLUDE_EXISTS=""
                INCLUDE_EXISTS=$(grep "$NGINX_VHOST_DIR" "$NGINX_MAIN_CONF" 2>/dev/null) || true
                if [[ -z "$INCLUDE_EXISTS" ]]; then
                  echo "Adding include directive to $NGINX_MAIN_CONF"
                  sudo sed -i "/http *{/a\\    include $NGINX_VHOST_DIR/*.conf;" "$NGINX_MAIN_CONF" 2>/dev/null || \
                    echo "WARNING: Could not add include directive"
                else
                  echo "Include directive already exists"
                fi
              fi
            fi
            
            # Set config file path
            NGINX_CONF="$NGINX_VHOST_DIR/lucky-sign.conf"
            echo "Will write nginx config to: $NGINX_CONF"
            echo "Main nginx config: ${NGINX_MAIN_CONF:-not detected}"
            
            # Check if certificate already exists
            CERT_EXISTS=false
            if [[ -f "/etc/letsencrypt/live/${DOMAIN}/fullchain.pem" ]]; then
              CERT_EXISTS=true
              echo "Certificate already exists for ${DOMAIN}"
            fi
            
            # Create initial HTTP-only config for ACME challenge
            if [[ "$CERT_EXISTS" == "false" ]]; then
              echo "Creating temporary HTTP config for ACME challenge..."
              sudo tee "$NGINX_CONF" > /dev/null << 'HTTPCONF'
            server {
                listen 80;
                listen [::]:80;
                server_name DOMAIN_PLACEHOLDER;
            
                location /.well-known/acme-challenge/ {
                    root /var/www/certbot;
                }
            
                location / {
                    return 200 'ACME setup in progress';
                    add_header Content-Type text/plain;
                }
            }
            HTTPCONF
              sudo sed -i "s/DOMAIN_PLACEHOLDER/${DOMAIN}/g" "$NGINX_CONF"
              
              # For sites-available pattern, create symlink to sites-enabled
              if [[ "$NGINX_VHOST_DIR" == */sites-available ]]; then
                NGINX_ENABLED="${NGINX_VHOST_DIR/sites-available/sites-enabled}/lucky-sign.conf"
                sudo mkdir -p "$(dirname "$NGINX_ENABLED")"
                sudo ln -sf "$NGINX_CONF" "$NGINX_ENABLED" 2>/dev/null || true
                # Remove default site if it conflicts
                sudo rm -f "$(dirname "$NGINX_ENABLED")/default" 2>/dev/null || true
              fi
              
              echo "Testing nginx configuration..."
              if ! sudo nginx -t; then
                echo "ERROR: nginx config test failed"
                echo "Config file contents:"
                sudo cat "$NGINX_CONF"
                exit 1
              fi
              
              # Reload nginx - try multiple methods including BT Panel path
              echo "Reloading nginx..."
              sudo systemctl enable nginx 2>/dev/null || true
              if sudo systemctl reload nginx 2>/dev/null; then
                echo "nginx reloaded via systemctl"
              elif sudo /www/server/nginx/sbin/nginx -s reload 2>/dev/null; then
                echo "nginx reloaded via BT Panel nginx"
              elif sudo nginx -s reload 2>/dev/null; then
                echo "nginx reloaded via nginx -s reload"
              elif sudo /etc/init.d/nginx reload 2>/dev/null; then
                echo "nginx reloaded via init.d"
              elif sudo systemctl start nginx 2>/dev/null; then
                echo "nginx started via systemctl"
              else
                echo "WARNING: Could not reload nginx, trying restart"
                sudo systemctl restart nginx 2>/dev/null || \
                  sudo /www/server/nginx/sbin/nginx 2>/dev/null || \
                  sudo nginx 2>/dev/null || true
              fi
              
              # Verify ACME challenge path is accessible locally before certbot
              echo "Verifying ACME challenge path locally..."
              echo "acme-test-$$" | sudo tee /var/www/certbot/.well-known/acme-challenge/selftest > /dev/null
              ACME_TEST_RESULT=$(curl -sS --max-time 5 -H "Host: ${DOMAIN}" "http://127.0.0.1/.well-known/acme-challenge/selftest" 2>&1) || true
              echo "Local ACME test: ${ACME_TEST_RESULT}"
              if [[ "$ACME_TEST_RESULT" == "acme-test-$$" ]]; then
                echo "ACME challenge path verified OK"
              else
                echo "WARNING: ACME local test did not return expected value"
                echo "This may indicate nginx config issue or firewall/WAF blocking"
              fi
              sudo rm -f /var/www/certbot/.well-known/acme-challenge/selftest
              
              echo ""
              echo "Obtaining Let's Encrypt certificate..."
              CERTBOT_BASE_OPTS="--non-interactive --agree-tos --register-unsafely-without-email"
              if [[ "${USE_STAGING}" == "true" ]]; then
                CERTBOT_BASE_OPTS="${CERTBOT_BASE_OPTS} --staging"
                echo "Using Let's Encrypt STAGING server"
              fi
              
              # Use webroot method (nginx plugin unreliable with pip install)
              CERTBOT_CMD="certbot certonly --webroot -w /var/www/certbot -d ${DOMAIN} ${CERTBOT_BASE_OPTS}"
              if [[ "$HAS_NGINX_PLUGIN" == "true" ]]; then
                echo "Using certbot nginx plugin..."
                CERTBOT_CMD="certbot --nginx -d ${DOMAIN} ${CERTBOT_BASE_OPTS}"
              else
                echo "Using certbot webroot method..."
              fi
              
              echo "Running: $CERTBOT_CMD"
              if sudo $CERTBOT_CMD; then
                echo "Certificate obtained successfully!"
              else
                CERTBOT_RC=$?
                echo ""
                echo "=========================================="
                echo "ERROR: certbot failed with exit code $CERTBOT_RC"
                echo "=========================================="
                echo ""
                echo "--- Last 50 lines of /var/log/letsencrypt/letsencrypt.log ---"
                sudo tail -50 /var/log/letsencrypt/letsencrypt.log 2>/dev/null || echo "(log not found)"
                echo ""
                echo "--- Possible causes ---"
                echo "1. Firewall: Ensure TCP 80 is open for ACME challenges"
                echo "2. Alibaba Cloud WAF/Beaver: May block requests to sslip.io domains"
                echo "   - Check if you see 'Server: Beaver' or 403 errors in the log"
                echo "   - Try disabling WAF temporarily or adding sslip.io to whitelist"
                echo "3. DNS: Ensure ${DOMAIN} resolves correctly from Let's Encrypt servers"
                echo ""
                echo "You can retry by running this workflow again after fixing the issue."
                exit 1
              fi
            fi
            
            set -e  # Re-enable exit on error for remaining config steps
            
            # Now create the full HTTPS config
            echo "Installing full nginx HTTPS config..."
            sudo tee "$NGINX_CONF" > /dev/null << 'NGINXCONF'
            # Nginx TLS reverse proxy for lucky-sign
            # Auto-generated by setup-https workflow
            
            upstream lucky_backend {
                server 127.0.0.1:8080;
                keepalive 32;
            }
            
            # Rate limiting for auth endpoints
            limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
            
            # Redirect HTTP to HTTPS
            server {
                listen 80;
                listen [::]:80;
                server_name DOMAIN_PLACEHOLDER;
            
                location /.well-known/acme-challenge/ {
                    root /var/www/certbot;
                }
            
                location / {
                    return 301 https://$host$request_uri;
                }
            }
            
            server {
                listen 443 ssl http2;
                listen [::]:443 ssl http2;
                server_name DOMAIN_PLACEHOLDER;
            
                # TLS certificates (Let's Encrypt)
                ssl_certificate /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
            
                # Modern TLS configuration
                ssl_protocols TLSv1.2 TLSv1.3;
                ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
                ssl_prefer_server_ciphers off;
                ssl_session_timeout 1d;
                ssl_session_cache shared:SSL:10m;
                ssl_session_tickets off;
            
                # Security headers
                add_header X-Content-Type-Options nosniff always;
                add_header X-Frame-Options DENY always;
            
                # API proxy
                location /api/ {
                    proxy_pass http://lucky_backend;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_connect_timeout 10s;
                    proxy_send_timeout 60s;
                    proxy_read_timeout 60s;
                    client_max_body_size 6M;
                }
            
                # Rate-limited auth endpoints
                location /api/auth/ {
                    limit_req zone=auth_limit burst=10 nodelay;
                    limit_req_status 429;
            
                    proxy_pass http://lucky_backend;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            
                # WebSocket proxy
                location /ws/ {
                    proxy_pass http://lucky_backend;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_read_timeout 86400s;
                    proxy_send_timeout 86400s;
                }
            
                # Static uploads
                location /uploads/ {
                    alias /www/wwwroot/lucky-api/uploads/;
                    expires 7d;
                    add_header Cache-Control "public, immutable";
                }
            
                # APK downloads
                location /downloads/ {
                    alias /www/wwwroot/lucky-api/downloads/;
                    expires 1d;
                    add_header Cache-Control "public";
                }
            
                # Flutter web app
                location /app/ {
                    alias /www/wwwroot/lucky-api/webapp/;
                    try_files $uri $uri/ /app/index.html;
                    expires 1h;
                }
            
                location / {
                    return 301 /app/;
                }
            }
            NGINXCONF
            
            # Replace domain placeholder
            sudo sed -i "s/DOMAIN_PLACEHOLDER/${DOMAIN}/g" "$NGINX_CONF"
            
            # For sites-available pattern, ensure symlink exists
            if [[ "$NGINX_VHOST_DIR" == */sites-available ]]; then
              NGINX_ENABLED="${NGINX_VHOST_DIR/sites-available/sites-enabled}/lucky-sign.conf"
              sudo ln -sf "$NGINX_CONF" "$NGINX_ENABLED" 2>/dev/null || true
            fi
            
            # Test and reload nginx
            echo "Testing nginx configuration..."
            if ! sudo nginx -t; then
              echo "ERROR: nginx config test failed after HTTPS setup"
              exit 1
            fi
            echo "Reloading nginx..."
            sudo systemctl reload nginx 2>/dev/null || \
              sudo /www/server/nginx/sbin/nginx -s reload 2>/dev/null || \
              sudo nginx -s reload 2>/dev/null || \
              sudo /etc/init.d/nginx reload 2>/dev/null || \
              sudo systemctl restart nginx 2>/dev/null || true
            
            # Ensure certbot renewal timer/cron exists
            echo "Setting up certificate auto-renewal..."
            if systemctl list-timers certbot.timer &>/dev/null; then
              sudo systemctl enable certbot.timer
              sudo systemctl start certbot.timer
              echo "Certbot systemd timer enabled"
            elif [[ ! -f /etc/cron.d/certbot ]]; then
              echo "0 0,12 * * * root certbot renew --quiet" | sudo tee /etc/cron.d/certbot > /dev/null
              echo "Certbot cron job created"
            else
              echo "Certbot renewal already configured"
            fi
            
            echo ""
            echo "=== HTTPS setup complete! ==="
            echo "Domain: ${DOMAIN}"
            echo "API Base: https://${DOMAIN}"
            echo "WS Base: wss://${DOMAIN}/ws"

      - name: Verify HTTPS
        id: verify
        env:
          DOMAIN: ${{ steps.domain.outputs.domain }}
        run: |
          set -euo pipefail
          
          echo "=== Verifying HTTPS setup ==="
          echo ""
          
          # Wait a moment for nginx to fully reload
          sleep 3
          
          # Test HTTPS connectivity
          echo "Testing HTTPS root endpoint..."
          HTTP_CODE=$(curl -fsSL -o /dev/null -w '%{http_code}' "https://${DOMAIN}/" --max-time 30 2>/dev/null || echo "000")
          if [[ "$HTTP_CODE" == "000" ]]; then
            echo "::warning::Could not connect to https://${DOMAIN}/ (check firewall)"
            HTTPS_OK="false"
          else
            echo "HTTPS root: HTTP ${HTTP_CODE}"
            HTTPS_OK="true"
          fi
          
          # Test API endpoint (may return 401/404 but TLS should work)
          echo ""
          echo "Testing API endpoint (TLS handshake)..."
          if curl -fsSI "https://${DOMAIN}/api/" --max-time 15 2>/dev/null; then
            echo "API endpoint reachable"
          else
            # Try verbose to check TLS
            echo "Checking TLS handshake..."
            curl -vsSI "https://${DOMAIN}/api/" --max-time 15 2>&1 | grep -E '(SSL|TLS|HTTP/)' || true
          fi
          
          # Get certificate info
          echo ""
          echo "=== Certificate Information ==="
          echo | openssl s_client -connect "${DOMAIN}:443" -servername "${DOMAIN}" 2>/dev/null | \
            openssl x509 -noout -dates -subject 2>/dev/null || echo "Could not retrieve certificate info (check firewall)"
          
          echo ""
          echo "https_ok=${HTTPS_OK}" >> "$GITHUB_OUTPUT"
          
          # Note about WebSocket testing
          echo ""
          echo "=== WebSocket Note ==="
          echo "The /ws/ endpoint is configured for WebSocket upgrade."
          echo "Manual test: wscat -c 'wss://${DOMAIN}/ws/'"
          echo "Or: websocat 'wss://${DOMAIN}/ws/'"

      - name: Write job summary
        env:
          DOMAIN: ${{ steps.domain.outputs.domain }}
          API_BASE: ${{ steps.domain.outputs.api_base }}
          WS_BASE: ${{ steps.domain.outputs.ws_base }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          HTTPS_OK: ${{ steps.verify.outputs.https_ok }}
        run: |
          {
            echo "# HTTPS Setup Complete"
            echo ""
            echo "## Endpoints"
            echo ""
            echo "| Endpoint | URL |"
            echo "|----------|-----|"
            echo "| Domain | \`${DOMAIN}\` |"
            echo "| API Base | \`${API_BASE}\` |"
            echo "| WS Base | \`${WS_BASE}\` |"
            echo "| Web App | \`${API_BASE}/app/\` |"
            echo "| Downloads | \`${API_BASE}/downloads/\` |"
            echo ""
            if [[ "${HTTPS_OK}" == "false" ]]; then
              echo "> ⚠️ **Warning**: HTTPS verification failed. Ensure firewall allows TCP 80 and 443."
              echo ""
            fi
            echo "## Next Steps (Required for APK/Web Builds)"
            echo ""
            echo "The current APK and Web publish workflows use \`https://\${{ secrets.DEPLOY_HOST }}\` for URLs."
            if [[ "${DEPLOY_HOST}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Your \`DEPLOY_HOST\` is a bare IP address (\`${DEPLOY_HOST}\`), which will **not** match the sslip.io certificate."
              echo ""
            fi
            echo "Choose **one** of these options:"
            echo ""
            echo "### Option A: Update DEPLOY_HOST Secret (Recommended)"
            echo ""
            echo "Update your GitHub Secret:"
            echo ""
            echo '```'
            echo "DEPLOY_HOST=${DOMAIN}"
            echo '```'
            echo ""
            echo "SSH will still work because sslip.io resolves to the same IP."
            echo ""
            echo "### Option B: Add Repository Variables"
            echo ""
            echo "Add these GitHub Variables (Settings → Secrets and variables → Actions → Variables):"
            echo ""
            echo '```'
            echo "PUBLIC_API_BASE=${API_BASE}"
            echo "PUBLIC_WS_BASE=${WS_BASE}"
            echo '```'
            echo ""
            echo "Then update your APK/Web workflows to use \`\${{ vars.PUBLIC_API_BASE }}\` instead of building URLs from DEPLOY_HOST."
            echo ""
            echo "## Firewall Reminder"
            echo ""
            echo "Ensure your cloud security group / firewall allows inbound TCP on ports:"
            echo "- **80** (HTTP, for ACME challenges and redirect)"
            echo "- **443** (HTTPS)"
            echo ""
            echo "## Certificate Renewal"
            echo ""
            echo "Let's Encrypt certificates are valid for 90 days. Certbot auto-renewal is configured via systemd timer or cron."
            echo "To manually check: \`sudo certbot renew --dry-run\`"
            echo ""
            echo "## Verification Commands"
            echo ""
            echo '```bash'
            echo "# Check certificate expiry"
            echo "echo | openssl s_client -connect ${DOMAIN}:443 -servername ${DOMAIN} 2>/dev/null | openssl x509 -noout -dates"
            echo ""
            echo "# Test HTTPS"
            echo "curl -fsSI https://${DOMAIN}/"
            echo ""
            echo "# Test WebSocket (requires wscat or websocat)"
            echo "wscat -c 'wss://${DOMAIN}/ws/'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
